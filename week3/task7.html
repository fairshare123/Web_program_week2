<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      width: 350px;
      text-align: center;
      border-radius: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: #16a34a;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px;
      font-size: 2rem;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .role {
      color: #64748b;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      background: #16a34a;
      color: white;
      padding: 7px 14px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">D</div>

    <div class="name">Dipika</div>

    <div class="role">Computer Engineering Student</div>

    <hr>

    <div class="skills">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
    </div>

  </div>

</body>
</html>
