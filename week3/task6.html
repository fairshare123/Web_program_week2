<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    nav {
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
    }

    .logo {
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .links {
      display: flex;
      gap: 25px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      color: #10b981;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">My Website</div>

    <div class="links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

</body>
</html>
