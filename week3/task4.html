<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .margin-box {
      background: #f0d68a;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .border-box {
      background: #64748b;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .padding-box {
      background: #bae6fd;
      padding: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content-box {
      background: #c4b5fd;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="margin-box">
    Margin

    <div class="border-box">
      Border

      <div class="padding-box">
        Padding

        <div class="content-box">
          Content
        </div>

      </div>
    </div>
  </div>

</body>
</html>
