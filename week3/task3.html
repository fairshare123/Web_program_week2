<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    .palette {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #f1f5f9;
    }

    .swatch {
      width: 120px;
      padding: 20px;
      color: white;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="palette">

    <div class="swatch" style="background: #ef4444;">
      #ef4444
    </div>

    <div class="swatch" style="background: #3b82f6;">
      #3b82f6
    </div>

    <div class="swatch" style="background: #22c55e;">
      #22c55e
    </div>

    <div class="swatch" style="background: #f59e0b;">
      #f59e0b
    </div>

    <div class="swatch" style="background: #8b5cf6;">
      #8b5cf6
    </div>

  </div>

</body>
</html>
