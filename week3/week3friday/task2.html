<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  .card {
    width: 280px;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);

    transition: transform 0.3s ease,
                box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(16, 185, 129, 0.4);
  }
</style>
</head>

<body>

  <div class="card">
    <h2>Hover Me</h2>
    <p>Move your mouse over the card.</p>
  </div>

</body>
</html>
