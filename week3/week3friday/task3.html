<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  .spinner {
    width: 50px;
    height: 50px;

    background: transparent;
    border: 4px solid #d1d5db;
    border-top-color: #0f766e;

    border-radius: 50%;

    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>

<body>

  <div class="spinner"></div>

</body>
</html>
