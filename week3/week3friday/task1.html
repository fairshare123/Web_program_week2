<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #0f766e;
    color: white;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
  }
</style>
</head>

<body>

  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px; color:#0f766e; font-weight:bold;">
      Special Offer
    </p>
  </div>

</body>
</html>
