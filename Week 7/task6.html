<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 7 Task 6 | Complete Book Search</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0fdfa;color:#23413e;line-height:1.6}
header,footer{background:white;padding:18px 7%;border-bottom:1px solid #d5eeea}
a{color:#0f766e;text-decoration:none;font-weight:bold}main{width:92%;max-width:1100px;margin:35px auto}
.tag{background:#ccfbf1;color:#134e4a;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
h1,h2,h3{color:#134e4a}.intro,.message{color:#647875}
.card{background:white;border:1px solid #d5eeea;border-radius:16px;padding:24px;margin-top:25px}
.filters{display:grid;grid-template-columns:2fr 2fr 1fr;gap:12px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}
input,select{width:100%;min-width:0;padding:11px;border:1px solid #bddbd6;border-radius:9px;font:inherit;background:white}
button{padding:11px 16px;border:0;border-radius:9px;background:#0f766e;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#134e4a}button:disabled{opacity:.5;cursor:not-allowed}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.book{display:flex;gap:14px;padding:16px;background:#f0fdfa;border:1px solid #d5eeea;border-radius:12px;min-width:0}
.cover{width:85px;height:125px;object-fit:cover;flex-shrink:0;background:#ccfbf1}.book h3{margin:0 0 5px}.book p{font-size:14px;margin:5px 0;overflow-wrap:anywhere}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.pagination{display:flex;gap:8px}.back{display:inline-block;margin:25px 0}
footer{text-align:center;color:#647875;border-top:1px solid #d5eeea}
@media(max-width:700px){.filters,.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="../index.html">← My Web Programming Portfolio</a></header>
<main>
<span class="tag">WEEK 7 · TASK 6</span>
<h1>Complete Book Search Engine</h1>
<p class="intro">Search, sort, and navigate through book results using the Open Library catalog.</p>

<section class="card">
<form id="searchForm">
    <div class="filters">
        <div>
            <label for="titleInput">Book title</label>
            <input id="titleInput" type="search" placeholder="Enter a title">
        </div>
        <div>
            <label for="authorInput">Author</label>
            <input id="authorInput" type="search" placeholder="Enter an author">
        </div>
        <div>
            <label for="sortSelect">Sort results</label>
            <select id="sortSelect">
                <option value="relevance">Relevance</option>
                <option value="title">Title A–Z</option>
                <option value="newest">Newest year</option>
                <option value="oldest">Oldest year</option>
            </select>
        </div>
    </div>
    <button type="submit" style="margin-top:14px">Search Books</button>
</form>

<div class="controls">
    <p id="status" class="message" aria-live="polite">Search for a book or author.</p>
    <span id="pageInfo" class="message"></span>
</div>

<div id="results" class="results"></div>

<div class="controls">
    <span id="resultCount" class="message"></span>
    <div class="pagination">
        <button id="previousButton" type="button" disabled>← Previous</button>
        <button id="nextButton" type="button" disabled>Next →</button>
    </div>
</div>
</section>

<a class="back" href="../index.html">← Back to Portfolio</a>
</main>
<footer>Week 7 · Task 6 · Complete Search Engine</footer>

<script>
const form=document.getElementById("searchForm");
const titleInput=document.getElementById("titleInput");
const authorInput=document.getElementById("authorInput");
const sortSelect=document.getElementById("sortSelect");
const status=document.getElementById("status");
const results=document.getElementById("results");
const pageInfo=document.getElementById("pageInfo");
const resultCount=document.getElementById("resultCount");
const previousButton=document.getElementById("previousButton");
const nextButton=document.getElementById("nextButton");

const pageSize=10;
let currentPage=1;
let totalResults=0;
let currentBooks=[];

form.addEventListener("submit",function(event){
    event.preventDefault();
    currentPage=1;
    loadPage();
});

previousButton.addEventListener("click",function(){
    if(currentPage>1){
        currentPage--;
        loadPage();
    }
});

nextButton.addEventListener("click",function(){
    if(currentPage*pageSize<totalResults){
        currentPage++;
        loadPage();
    }
});

sortSelect.addEventListener("change",renderBooks);

async function loadPage(){
    const title=titleInput.value.trim();
    const author=authorInput.value.trim();

    if(!title&&!author){
        status.textContent="Enter a title or author to search.";
        results.replaceChildren();
        pageInfo.textContent="";
        resultCount.textContent="";
        previousButton.disabled=true;
        nextButton.disabled=true;
        return;
    }

    status.textContent="Loading books...";
    results.replaceChildren();
    previousButton.disabled=true;
    nextButton.disabled=true;

    try{
        const params=new URLSearchParams({
            limit:String(pageSize),
            offset:String((currentPage-1)*pageSize),
            fields:"key,title,author_name,first_publish_year,cover_i"
        });

        if(title) params.set("title",title);
        if(author) params.set("author",author);

        const response=await fetch("https://openlibrary.org/search.json?"+params);
        if(!response.ok) throw new Error("Search request failed.");

        const data=await response.json();
        currentBooks=data.docs||[];
        totalResults=data.numFound||0;

        if(!currentBooks.length){
            status.textContent="No books found. Try different search terms.";
            pageInfo.textContent="";
            resultCount.textContent="0 results";
            return;
        }

        status.textContent="Search completed.";
        renderBooks();

    }catch(error){
        status.textContent="Could not load the books. Please try again.";
        resultCount.textContent="";
        console.error(error);
    }finally{
        previousButton.disabled=currentPage<=1;
        nextButton.disabled=currentPage*pageSize>=totalResults;
    }
}

function renderBooks(){
    const books=[...currentBooks];
    const sort=sortSelect.value;

    if(sort==="title"){
        books.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
    }else if(sort==="newest"){
        books.sort((a,b)=>(b.first_publish_year||0)-(a.first_publish_year||0));
    }else if(sort==="oldest"){
        books.sort((a,b)=>(a.first_publish_year||99999)-(b.first_publish_year||99999));
    }

    results.replaceChildren();

    books.forEach(book=>{
        const card=document.createElement("article");
        card.className="book";

        if(book.cover_i){
            const cover=document.createElement("img");
            cover.className="cover";
            cover.alt="Book cover";
            cover.loading="lazy";
            cover.src=`https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
            card.appendChild(cover);
        }

        const details=document.createElement("div");
        const title=document.createElement("h3");
        title.textContent=book.title||"Untitled";

        const author=document.createElement("p");
        author.textContent="Author: "+(book.author_name?.slice(0,3).join(", ")||"Unknown");

        const year=document.createElement("p");
        year.textContent="First published: "+(book.first_publish_year||"Unknown");

        details.append(title,author,year);
        card.appendChild(details);
        results.appendChild(card);
    });

    pageInfo.textContent=`Page ${currentPage}`;
    resultCount.textContent=`About ${totalResults.toLocaleString()} results`;
    previousButton.disabled=currentPage<=1;
    nextButton.disabled=currentPage*pageSize>=totalResults;
}
</script>
</body>
</html>
