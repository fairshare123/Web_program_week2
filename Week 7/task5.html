<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 7 Task 5 | Enhanced Book Search</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0fdfa;color:#23413e;line-height:1.6}
header,footer{background:white;padding:18px 7%;border-bottom:1px solid #d5eeea}
a{color:#0f766e;text-decoration:none;font-weight:bold}main{width:92%;max-width:1050px;margin:35px auto}
.tag{background:#ccfbf1;color:#134e4a;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
h1,h2,h3{color:#134e4a}.intro,.message{color:#647875}
.card{background:white;border:1px solid #d5eeea;border-radius:16px;padding:24px;margin-top:25px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}
input{width:100%;min-width:0;padding:11px;border:1px solid #bddbd6;border-radius:9px;font:inherit}
button{padding:11px 16px;border:0;border-radius:9px;background:#0f766e;color:white;font-weight:bold;cursor:pointer;margin-top:12px}
button:hover{background:#134e4a}button:disabled{opacity:.6;cursor:wait}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.book{display:flex;gap:14px;padding:16px;background:#f0fdfa;border:1px solid #d5eeea;border-radius:12px}
.cover{width:85px;height:125px;object-fit:cover;flex-shrink:0;background:#ccfbf1}.book h3{margin:0 0 5px}.book p{font-size:14px;margin:5px 0}
.back{display:inline-block;margin:25px 0}footer{text-align:center;color:#647875;border-top:1px solid #d5eeea}
@media(max-width:700px){.filters,.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="../index.html">← My Web Programming Portfolio</a></header>
<main>
<span class="tag">WEEK 7 · TASK 5</span>
<h1>Enhanced Book Search</h1>
<p class="intro">Search by title or author and optionally narrow the results by first publication year.</p>

<section class="card">
<form id="searchForm">
    <div class="filters">
        <div>
            <label for="titleInput">Book title</label>
            <input id="titleInput" type="search" placeholder="e.g. Dune">
        </div>
        <div>
            <label for="authorInput">Author</label>
            <input id="authorInput" type="search" placeholder="e.g. Frank Herbert">
        </div>
        <div>
            <label for="yearInput">First publication year</label>
            <input id="yearInput" type="number" min="1" max="2026" placeholder="Optional">
        </div>
    </div>
    <button id="searchButton" type="submit">Search Books</button>
</form>

<p id="status" class="message" aria-live="polite">Enter a title or author to start searching.</p>
<div id="results" class="results"></div>
</section>

<a class="back" href="../index.html">← Back to Portfolio</a>
</main>
<footer>Week 7 · Task 5 · Enhanced Search</footer>

<script>
const form=document.getElementById("searchForm");
const titleInput=document.getElementById("titleInput");
const authorInput=document.getElementById("authorInput");
const yearInput=document.getElementById("yearInput");
const status=document.getElementById("status");
const results=document.getElementById("results");
const button=document.getElementById("searchButton");

form.addEventListener("submit",searchBooks);

async function searchBooks(event){
    event.preventDefault();

    const title=titleInput.value.trim();
    const author=authorInput.value.trim();
    const yearText=yearInput.value.trim();

    if(!title&&!author){
        status.textContent="Enter a title or author. The year is an optional filter.";
        results.replaceChildren();
        return;
    }

    if(yearText && (!Number.isInteger(Number(yearText)) || Number(yearText)<1 || Number(yearText)>2026)){
        status.textContent="Enter a valid publication year.";
        return;
    }

    status.textContent="Searching...";
    results.replaceChildren();
    button.disabled=true;

    try{
        const params=new URLSearchParams({
            limit:"40",
            fields:"key,title,author_name,first_publish_year,cover_i"
        });

        if(title) params.set("title",title);
        if(author) params.set("author",author);

        const response=await fetch("https://openlibrary.org/search.json?"+params);
        if(!response.ok) throw new Error("Search request failed.");

        const data=await response.json();
        let books=data.docs||[];

        if(yearText){
            books=books.filter(book=>book.first_publish_year===Number(yearText));
        }

        if(!books.length){
            status.textContent="No books matched those filters. Try changing your search.";
            return;
        }

        status.textContent=`Showing ${books.length} matching books${data.numFound ? ` from ${data.numFound.toLocaleString()} API results` : ""}.`;

        books.slice(0,20).forEach(book=>{
            const card=document.createElement("article");
            card.className="book";

            if(book.cover_i){
                const cover=document.createElement("img");
                cover.className="cover";
                cover.alt="Book cover";
                cover.loading="lazy";
                cover.src=`https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
                card.appendChild(cover);
            }

            const info=document.createElement("div");
            const name=document.createElement("h3");
            name.textContent=book.title||"Untitled";
            const authorText=document.createElement("p");
            authorText.textContent="Author: "+(book.author_name?.slice(0,3).join(", ")||"Unknown");
            const year=document.createElement("p");
            year.textContent="First published: "+(book.first_publish_year||"Unknown");
            info.append(name,authorText,year);
            card.appendChild(info);
            results.appendChild(card);
        });

    }catch(error){
        status.textContent="Something went wrong while searching. Please try again.";
        console.error(error);
    }finally{
        button.disabled=false;
    }
}
</script>
</body>
</html>
