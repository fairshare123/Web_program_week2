<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Counter | Week 5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdfa;
            color: #23413e;
        }

        header {
            background: white;
            padding: 18px 7%;
            border-bottom: 1px solid #d5eeea;
        }

        header a {
            color: #134e4a;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        h1, h2 {
            color: #134e4a;
        }

        .intro {
            color: #647875;
            line-height: 1.7;
        }

        .counter-card {
            background: white;
            border: 1px solid #d5eeea;
            border-radius: 18px;
            padding: 30px 20px;
            margin-top: 30px;
            text-align: center;
        }

        #count {
            font-size: 90px;
            font-weight: bold;
            color: #134e4a;
            margin: 10px;
        }

        #status {
            color: #647875;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: #0f766e;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5eead4;
        
        }

        .subtract {
            background: #ccfbf1;
            color: #134e4a;
        }

        .reset {
            background: #fff1f2;
            color: #be123c;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #0f766e;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #647875;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Week 5 Homepage</a>
</header>

<main>
    <h1>Little Counter</h1>

    <p class="intro">
        This interactive counter uses a JavaScript variable and functions
        to update a number when the buttons are clicked.
    </p>

    <section class="counter-card">
        <h2>Your Current Count</h2>

        <div id="count" aria-live="polite">0</div>

        <p id="status">Your counter is ready!</p>

        <div class="buttons">
            <button onclick="increaseCount()">+ Add</button>
            <button class="subtract" onclick="decreaseCount()">− Subtract</button>
            <button class="reset" onclick="resetCount()">Reset</button>
        </div>
    </section>

    <a class="back" href="index.html">← Back to Week 5 Homepage</a>
</main>

<footer>Week 5 · JavaScript Counter</footer>

<script>
    let count = 0;

    function updateDisplay() {
        document.getElementById("count").textContent = count;
    }

    function increaseCount() {
        count++;
        updateDisplay();

        document.getElementById("status").textContent =
            "Count increased by one!";
    }

    function decreaseCount() {
        count--;
        updateDisplay();

        document.getElementById("status").textContent =
            "Count decreased by one!";
    }

    function resetCount() {
        count = 0;
        updateDisplay();

        document.getElementById("status").textContent =
            "The counter has been reset!";
    }
</script>

</body>
</html>
